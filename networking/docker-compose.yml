version: "3.8"

# ═══════════════════════════════════════════════════════════════════
# NETWORKING STACK
# Services: Traefik, AdGuard Home, Tailscale
# Start this FIRST — everything else depends on proxy network routing.
#
# Traefik Dashboard → http://traefik.${DOMAIN} or http://SERVER_IP:8082
# AdGuard Home      → http://adguard.${DOMAIN} or http://SERVER_IP:3000
# ═══════════════════════════════════════════════════════════════════

networks:
  proxy:
    external: true

services:

  # ───────────────────────────────────────────────────────────────
  # TRAEFIK — Reverse proxy + automatic routing
  # Watches Docker labels across ALL stacks and routes accordingly.
  # All other services expose themselves via labels, not raw ports.
  # ───────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: traefik
    env_file:
      - /opt/containers/.env
    command:
      # Fail2ban Authentication
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/traefik/access.log"      
      # API & Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # Docker provider — watches labels on all containers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      # File provider — for static routing rules
      - "--providers.file.directory=/config/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Optional: Let's Encrypt (uncomment if you have a real domain)
      # - "--certificatesresolvers.letsencrypt.acme.email=your@email.com"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Metrics for Prometheus
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"      # Traefik dashboard (direct port access, no label loop)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/containers/networking/logs:/logs
      - ${CONFIG_ROOT}/networking/config/traefik/certs:/certs
      - ${CONFIG_ROOT}/networking/config/traefik/dynamic:/config/dynamic
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      # Basic auth middleware for dashboard (generate: htpasswd -nb admin password)
      # - "traefik.http.middlewares.auth.basicauth.users=admin:$$2y$$..."
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────
  # ADGUARD HOME — DNS server + network-wide ad blocking
  # First-run setup: http://SERVER_IP:3000
  # After setup, point router DNS to SERVER_IP
  # Change DNS listen port from 53 if systemd-resolved conflicts:
  #   sudo systemctl disable systemd-resolved
  #   sudo systemctl stop systemd-resolved
  # ───────────────────────────────────────────────────────────────
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    env_file:
      - /opt/containers/.env
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/networking/config/adguard/work:/opt/adguardhome/work
      - ${CONFIG_ROOT}/networking/config/adguard/conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"     # Initial setup UI
      - "8083:80/tcp"       # Admin UI after setup
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN}`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────
  # TAILSCALE — Secure remote access (zero exposed ports)
  # After first run: check logs for auth URL, or use TAILSCALE_AUTH_KEY
  # Gives you access to all internal services from anywhere.
  # ───────────────────────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    env_file:
      - /opt/containers/.env
    hostname: ${DOMAIN:-homelab}
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ACCEPT_DNS=false
      - TS_EXTRA_ARGS=--advertise-routes=10.0.0.0/24
    volumes:
      - ${CONFIG_ROOT}/networking/config/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: host
    restart: unless-stopped
